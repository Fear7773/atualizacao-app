name: Build PDF CISMETRO v3.5

on:
  push:
    branches:
      - build/pdf-cismetro-v3-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct source
        shell: pwsh
        run: |
          @'
          import base64, lzma
          from pathlib import Path
          root = Path("pdf-cismetro-v3.5")
          raw = base64.b64decode(root.joinpath("source.xz.b64").read_text().strip())
          root.joinpath("PDF_CISMETRO_v3_5.py").write_bytes(lzma.decompress(raw))
          '@ | python -

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pdf-cismetro-v3.5/requirements.txt

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile pdf-cismetro-v3.5/PDF_CISMETRO_v3_5.py

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name PDF_CISMETRO_v3_5 `
            --collect-all tkinterdnd2 `
            --collect-all reportlab `
            --hidden-import PIL.ImageTk `
            pdf-cismetro-v3.5/PDF_CISMETRO_v3_5.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "pdf-cismetro-v3.5\PDF_CISMETRO_v3_5.iss"

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\PDF_CISMETRO_v3_5.exe" "release\PDF_CISMETRO_v3_5.exe"
          Copy-Item "pdf-cismetro-v3.5\installer_output\Instalador_PDF_CISMETRO_v3_5.exe" "release\Instalador_PDF_CISMETRO_v3_5.exe"
          Get-FileHash release\*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content release\SHA256.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PDF_CISMETRO_v3_5_Windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
